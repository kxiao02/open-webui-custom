services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PIP_INDEX_URL=${PIP_INDEX_URL}
        - UV_INDEX_URL=${UV_INDEX_URL}
    environment:
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS}
      - LANGGRAPH_HOST=${LANGGRAPH_HOST}
      - LANGGRAPH_PORT=${LANGGRAPH_PORT}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL}
      - DEEPSEEK_THINKING_MODEL=${DEEPSEEK_THINKING_MODEL}
      - DEEPSEEK_TEMPERATURE=${DEEPSEEK_TEMPERATURE}
      - BOCHA_API_KEY=${BOCHA_API_KEY}
      - BOCHA_API_URL=${BOCHA_API_URL}
    ports:
      - "${LANGGRAPH_HOST_PORT}:${LANGGRAPH_PORT}"
    networks:
      - appnet

  adapter:
    build:
      context: ./openai-adapter
      dockerfile: Dockerfile
      args:
        - PIP_INDEX_URL=${PIP_INDEX_URL}
        - PIP_TRUSTED_HOST=${PIP_TRUSTED_HOST}
    environment:
      - LANGGRAPH_BASE_URL=${LANGGRAPH_BASE_URL}
      - DEEPAGENT_ASSISTANT_ID=${DEEPAGENT_ASSISTANT_ID}
      - DEEPAGENT_THINKING_ASSISTANT_ID=${DEEPAGENT_THINKING_ASSISTANT_ID}
      - DEFAULT_MODEL_ID=${DEFAULT_MODEL_ID}
      - ADAPTER_HOST=${ADAPTER_HOST:-0.0.0.0}
      - ADAPTER_PORT=${ADAPTER_PORT:-8081}
    ports:
      - "${ADAPTER_HOST_PORT:-8081}:${ADAPTER_PORT:-8081}"
    depends_on:
      - agent
    networks:
      - appnet

  open_webui:
    build:
      context: ../open-webui
      dockerfile: Dockerfile
      args:
        - NPM_CONFIG_REGISTRY=${NPM_CONFIG_REGISTRY}
        - GITHUB_MIRROR_PREFIX=${GITHUB_MIRROR_PREFIX}
        - NODE_MAX_OLD_SPACE_SIZE=${NODE_MAX_OLD_SPACE_SIZE}
        - HF_ENDPOINT=${HF_ENDPOINT}
        - PIP_INDEX_URL=${PIP_INDEX_URL}
        - UV_INDEX_URL=${UV_INDEX_URL}
        - PIP_TRUSTED_HOST=${PIP_TRUSTED_HOST}
        - PYTORCH_INDEX_URL_CPU=${PYTORCH_INDEX_URL_CPU}
        - PYTORCH_INDEX_URL_CUDA=${PYTORCH_INDEX_URL_CUDA}
    environment:
      - OPENAI_API_BASE_URLS=${OPENAI_API_BASE_URLS}
      - OPENAI_API_KEYS=${OPENAI_API_KEYS}
      - ENABLE_OPENAI_API=${ENABLE_OPENAI_API}
      - ENABLE_OLLAMA_API=${ENABLE_OLLAMA_API}
      - HF_ENDPOINT=${HF_ENDPOINT}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_URL=${WEBUI_URL}
      - PORT=${OPEN_WEBUI_PORT}
    ports:
      - "${OPEN_WEBUI_HOST_PORT}:${OPEN_WEBUI_PORT}"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - adapter
    networks:
      - appnet

volumes:
  open-webui-data:

networks:
  appnet:
    driver: bridge
