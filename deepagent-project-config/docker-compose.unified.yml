services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ACTIVE_MODEL_PROVIDER=${ACTIVE_MODEL_PROVIDER:-cpecc}
      - REASONING_MODEL_PROVIDER=${REASONING_MODEL_PROVIDER:-}
      - REASONING_API_KEY=${REASONING_API_KEY:-}
      - REASONING_BASE_URL=${REASONING_BASE_URL:-}
      - REASONING_MODEL=${REASONING_MODEL:-}
      - REASONING_TEMPERATURE=${REASONING_TEMPERATURE:-}
      - REASONING_TIMEOUT=${REASONING_TIMEOUT:-}
      - VISION_MODEL_PROVIDER=${VISION_MODEL_PROVIDER:-}
      - VISION_API_KEY=${VISION_API_KEY:-}
      - VISION_BASE_URL=${VISION_BASE_URL:-}
      - VISION_MODEL=${VISION_MODEL:-}
      - VISION_TEMPERATURE=${VISION_TEMPERATURE:-}
      - VISION_TIMEOUT=${VISION_TIMEOUT:-}
      - CHAT_MODEL_PROVIDER=${CHAT_MODEL_PROVIDER:-}
      - CHAT_API_KEY=${CHAT_API_KEY:-}
      - CHAT_BASE_URL=${CHAT_BASE_URL:-}
      - CHAT_MODEL=${CHAT_MODEL:-}
      - CHAT_TEMPERATURE=${CHAT_TEMPERATURE:-}
      - CHAT_TIMEOUT=${CHAT_TIMEOUT:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS}
      - LANGGRAPH_HOST=${LANGGRAPH_HOST}
      - LANGGRAPH_PORT=${LANGGRAPH_PORT}
      - BOCHA_API_KEY=${BOCHA_API_KEY}
      - BOCHA_API_URL=${BOCHA_API_URL}
    ports:
      - "${LANGGRAPH_HOST_PORT}:${LANGGRAPH_PORT}"
    networks:
      - appnet

  adapter:
    build:
      context: ./openai-adapter
      dockerfile: Dockerfile
    environment:
      - LANGGRAPH_BASE_URL=${LANGGRAPH_BASE_URL}
      - DEEPAGENT_ASSISTANT_ID=${DEEPAGENT_ASSISTANT_ID}
      - DEEPAGENT_THINKING_ASSISTANT_ID=${DEEPAGENT_THINKING_ASSISTANT_ID}
      - DEFAULT_MODEL_ID=${DEFAULT_MODEL_ID}
      - ADAPTER_HOST=${ADAPTER_HOST:-0.0.0.0}
      - ADAPTER_PORT=${ADAPTER_PORT:-8081}
    ports:
      - "${ADAPTER_HOST_PORT:-8081}:${ADAPTER_PORT:-8081}"
    depends_on:
      - agent
    networks:
      - appnet

  open_webui:
    build:
      context: ../open-webui
      dockerfile: Dockerfile
    environment:
      - OPENAI_API_BASE_URLS=${OPENAI_API_BASE_URLS}
      - OPENAI_API_KEYS=${OPENAI_API_KEYS}
      - ENABLE_OPENAI_API=${ENABLE_OPENAI_API}
      - ENABLE_OLLAMA_API=${ENABLE_OLLAMA_API}
      - AUDIO_STT_ENGINE=${AUDIO_STT_ENGINE:-openai}
      - AUDIO_STT_MODEL=${AUDIO_STT_MODEL:-qwen3asr}
      - AUDIO_STT_SUPPORTED_CONTENT_TYPES=${AUDIO_STT_SUPPORTED_CONTENT_TYPES:-audio/*,video/webm}
      - AUDIO_STT_OPENAI_API_BASE_URL=${AUDIO_STT_OPENAI_API_BASE_URL:-http://10.30.186.2:32788/v1}
      - AUDIO_STT_OPENAI_API_KEY=${AUDIO_STT_OPENAI_API_KEY:-}
      - AUDIO_STT_EXTERNAL_FALLBACK_TO_LOCAL=${AUDIO_STT_EXTERNAL_FALLBACK_TO_LOCAL:-true}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - RAG_EMBEDDING_ENGINE=${RAG_EMBEDDING_ENGINE:-openai}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-bge}
      - RAG_OPENAI_API_BASE_URL=${RAG_OPENAI_API_BASE_URL:-http://10.30.186.2:32788/v1}
      - RAG_OPENAI_API_KEY=${RAG_OPENAI_API_KEY:-}
      - RAG_EMBEDDING_EXTERNAL_FALLBACK_TO_LOCAL=${RAG_EMBEDDING_EXTERNAL_FALLBACK_TO_LOCAL:-true}
      - RAG_EMBEDDING_FALLBACK_MODEL=${RAG_EMBEDDING_FALLBACK_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS=${USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_URL=${WEBUI_URL}
      - WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL-}
      - WEBUI_ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD-}
      - WEBUI_ADMIN_NAME=${WEBUI_ADMIN_NAME-}
      - DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE-pending}
      - ENABLE_OAUTH_SIGNUP=${ENABLE_OAUTH_SIGNUP-true}
      - ENTERPRISE_OAUTH_ENABLED=${ENTERPRISE_OAUTH_ENABLED-false}
      - ENTERPRISE_OAUTH_PROVIDER_NAME=${ENTERPRISE_OAUTH_PROVIDER_NAME-Enterprise SSO}
      - ENTERPRISE_OAUTH_CLIENT_ID=${ENTERPRISE_OAUTH_CLIENT_ID-}
      - ENTERPRISE_OAUTH_CLIENT_SECRET=${ENTERPRISE_OAUTH_CLIENT_SECRET-}
      - ENTERPRISE_OAUTH_AUTHORIZE_URL=${ENTERPRISE_OAUTH_AUTHORIZE_URL-}
      - ENTERPRISE_OAUTH_TOKEN_URL=${ENTERPRISE_OAUTH_TOKEN_URL-}
      - ENTERPRISE_OAUTH_PROFILE_URL=${ENTERPRISE_OAUTH_PROFILE_URL-}
      - ENTERPRISE_OAUTH_CHECK_TOKEN_URL=${ENTERPRISE_OAUTH_CHECK_TOKEN_URL-}
      - ENTERPRISE_OAUTH_LOGOUT_URL=${ENTERPRISE_OAUTH_LOGOUT_URL-}
      - ENTERPRISE_OAUTH_REDIRECT_URI=${ENTERPRISE_OAUTH_REDIRECT_URI-}
      - ENTERPRISE_OAUTH_AUTHORIZE_REDIRECT_PARAM=${ENTERPRISE_OAUTH_AUTHORIZE_REDIRECT_PARAM-redirect_url}
      - ENTERPRISE_OAUTH_TOKEN_REDIRECT_PARAM=${ENTERPRISE_OAUTH_TOKEN_REDIRECT_PARAM-redirect.uri}
      - ENTERPRISE_OAUTH_ID_CLAIM=${ENTERPRISE_OAUTH_ID_CLAIM-id}
      - ENTERPRISE_OAUTH_ACCOUNT_NO_PATH=${ENTERPRISE_OAUTH_ACCOUNT_NO_PATH-attributes.account_no}
      - ENTERPRISE_OAUTH_EMAIL_CLAIM=${ENTERPRISE_OAUTH_EMAIL_CLAIM-}
      - ENTERPRISE_OAUTH_EMAIL_DOMAIN=${ENTERPRISE_OAUTH_EMAIL_DOMAIN-local}
      - DATABASE_URL=${DATABASE_URL-}
      - PORT=${OPEN_WEBUI_PORT}
    ports:
      - "${OPEN_WEBUI_HOST_PORT}:${OPEN_WEBUI_PORT}"
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - adapter
    networks:
      - appnet

volumes:
  open-webui-data:

networks:
  appnet:
    driver: bridge
