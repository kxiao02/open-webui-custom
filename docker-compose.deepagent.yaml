# Override for deepagent integration.
# Usage: docker compose -f docker-compose.yaml -f docker-compose.deepagent.yaml up
#
# Disables Ollama and points Open WebUI at the agent-bridge instead.
# The agent-bridge must be running separately (see deepagent-project).

services:
  ollama:
    profiles:
      - disabled

  open-webui:
    environment:
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL:-http://agent-bridge:8000/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder}
      - ENABLE_OLLAMA_API=false
    depends_on: []
