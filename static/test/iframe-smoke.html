<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iframe Smoke Test</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #111827;
      --muted: #64748b;
      --border: #2563eb;
      --accent: #2563eb;
    }

    :root.dark {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #111827;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #38bdf8;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, color-mix(in srgb, var(--accent) 18%, transparent), transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 24px;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      border: 2px solid var(--border);
      border-radius: 20px;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.18);
      padding: 22px;
    }

    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 44px); line-height: 1; }
    p { margin: 8px 0; color: var(--muted); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin: 18px 0;
    }

    .tile {
      border: 1px solid color-mix(in srgb, var(--border) 45%, transparent);
      border-radius: 14px;
      padding: 12px;
      background: color-mix(in srgb, var(--card) 86%, transparent);
    }

    .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .value { margin-top: 5px; font-weight: 700; color: var(--text); word-break: break-word; }

    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-weight: 700;
      padding: 10px 14px;
      cursor: pointer;
      margin: 6px 8px 0 0;
    }

    pre {
      overflow: auto;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.08);
      padding: 12px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main id="card">
    <h1>Iframe Smoke Test</h1>
    <p>This page is intentionally simple and self-contained for iframe rendering checks.</p>

    <div class="grid">
      <div class="tile"><div class="label">Script</div><div id="script-status" class="value">not-run</div></div>
      <div class="tile"><div class="label">Theme</div><div id="theme-status" class="value">not-received</div></div>
      <div class="tile"><div class="label">Click</div><div id="click-status" class="value">waiting</div></div>
      <div class="tile"><div class="label">Payload</div><div id="payload-status" class="value">not-requested</div></div>
    </div>

    <button id="iframe-action" type="button">Click inside iframe</button>
    <button id="height-action" type="button">Report 900px height</button>
    <button id="payload-action" type="button">Request payload</button>

    <pre id="debug-log">ready</pre>
  </main>

  <script>
    (function () {
      var scriptStatus = document.getElementById('script-status');
      var themeStatus = document.getElementById('theme-status');
      var clickStatus = document.getElementById('click-status');
      var payloadStatus = document.getElementById('payload-status');
      var debugLog = document.getElementById('debug-log');
      var root = document.documentElement;

      function log(message) {
        debugLog.textContent = new Date().toISOString() + ' ' + message + '\n' + debugLog.textContent;
      }

      function reportHeight(height) {
        window.parent.postMessage({ type: 'iframe:height', height: height || document.documentElement.scrollHeight + 20 }, '*');
      }

      scriptStatus.textContent = 'script-ran';
      log('script initialized');
      reportHeight();

      document.getElementById('iframe-action').addEventListener('click', function () {
        clickStatus.textContent = 'clicked';
        log('button clicked');
        reportHeight();
      });

      document.getElementById('height-action').addEventListener('click', function () {
        clickStatus.textContent = 'height-reported';
        log('reported fixed iframe height 900');
        reportHeight(900);
      });

      document.getElementById('payload-action').addEventListener('click', function () {
        payloadStatus.textContent = 'requesting';
        log('requesting parent payload');
        window.parent.postMessage({ type: 'payload', requestId: 'iframe-smoke-' + Date.now() }, '*');
      });

      window.addEventListener('message', function (event) {
        var data = event.data || {};
        if (data.type === 'open-webui:theme') {
          var theme = data.theme || {};
          var name = theme.theme || 'unknown';
          themeStatus.textContent = 'theme:' + name;
          root.classList.toggle('dark', name === 'dark');
          log('theme received: ' + name);
          reportHeight();
        }

        if (data.type === 'payload') {
          payloadStatus.textContent = data.payload == null ? 'payload:null' : 'payload:received';
          log('payload response received');
        }
      });
    })();
  </script>
</body>
</html>
