<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>中电慧语 iframe Widget Test</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --card: #ffffff;
      --ink: #172033;
      --brand: #1f5fe8;
      --radius: 24px;
      --control-bg: #ffffff;
      --launcher-width: clamp(144px, 15vw, 256px);
      --launcher-height: clamp(81px, 8.4375vw, 144px);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 18%, rgba(31, 95, 232, 0.16), transparent 30rem),
        radial-gradient(circle at 88% 78%, rgba(230, 0, 18, 0.11), transparent 24rem),
        linear-gradient(135deg, #ffffff 0%, var(--bg) 54%, #eef3ff 100%);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body.is-widget-interacting,
    body.is-widget-interacting * {
      user-select: none;
    }

    .launcher {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      width: var(--launcher-width);
      height: var(--launcher-height);
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      color: var(--ink);
      cursor: grab;
      overflow: visible;
      padding: 0;
      user-select: none;
      touch-action: none;
      transition: box-shadow 180ms ease, opacity 180ms ease;
      will-change: transform;
    }

    .launcher:hover,
    .launcher:focus-visible {
      box-shadow: none;
      outline: none;
      transform: translate3d(var(--launcher-x, 0), var(--launcher-y, 0), 0) scale(1.02);
    }

    .launcher:active { cursor: grabbing; }

    .launcher.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .launcher.has-bubble-pop {
      animation: launcher-bubble-pop 520ms cubic-bezier(.18,.9,.22,1.2);
    }

    .launcher-bubble {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 26;
      display: grid;
      max-width: min(286px, calc(100vw - 32px));
      min-width: 168px;
      gap: 4px;
      border: 1px solid rgba(31, 95, 232, 0.14);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.2);
      color: #0f172a;
      cursor: pointer;
      font: inherit;
      line-height: 1.35;
      opacity: 0;
      padding: 12px 14px;
      pointer-events: none;
      text-align: left;
      transform: translate3d(var(--bubble-x, 0), var(--bubble-y, 0), 0) translateY(8px) scale(.92);
      transform-origin: var(--bubble-arrow-x, calc(100% - 26px)) 100%;
      transition: opacity 160ms ease, transform 180ms cubic-bezier(.2,.9,.2,1);
      user-select: none;
      will-change: transform, opacity;
    }

    .launcher-bubble::after {
      position: absolute;
      bottom: -6px;
      left: var(--bubble-arrow-x, calc(100% - 26px));
      width: 12px;
      height: 12px;
      border-right: 1px solid rgba(31, 95, 232, 0.14);
      border-bottom: 1px solid rgba(31, 95, 232, 0.14);
      background: rgba(255, 255, 255, 0.96);
      content: "";
      transform: translateX(-50%) rotate(45deg);
    }

    .launcher-bubble.is-below {
      transform-origin: var(--bubble-arrow-x, calc(100% - 26px)) 0;
    }

    .launcher-bubble.is-below::after {
      top: -6px;
      bottom: auto;
      border: 0;
      border-left: 1px solid rgba(31, 95, 232, 0.14);
      border-top: 1px solid rgba(31, 95, 232, 0.14);
    }

    .launcher-bubble.is-visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate3d(var(--bubble-x, 0), var(--bubble-y, 0), 0) translateY(0) scale(1);
    }

    .launcher-bubble.is-popping {
      animation: bubble-pop 460ms cubic-bezier(.16,.9,.28,1.18);
    }

    .launcher.is-hidden + .launcher-bubble {
      opacity: 0;
      pointer-events: none;
    }

    .bubble-title {
      display: block;
      color: #1f5fe8;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .01em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bubble-title:empty {
      display: none;
    }

    .bubble-content {
      display: -webkit-box;
      overflow: hidden;
      color: #1e293b;
      font-size: 13px;
      font-weight: 600;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }

    .bubble-content:empty {
      display: none;
    }

    .logo-disc {
      display: grid;
      width: 100%;
      height: 100%;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      pointer-events: none;
    }

    .logo-disc img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    .widget-window {
      position: fixed;
      z-index: 30;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      border: 0;
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: 0 30px 90px rgba(15, 23, 42, 0.2);
      opacity: 0;
      pointer-events: none;
      transform-origin: center center;
      backdrop-filter: blur(20px);
      will-change: left, top, width, height, transform;
    }

    .widget-window.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .widget-header {
      position: relative;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 50px;
      border-bottom: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(248, 250, 252, 0.56));
      cursor: grab;
      padding: 4px 12px;
      touch-action: none;
      user-select: none;
    }

    .widget-header:active { cursor: grabbing; }

    .widget-actions {
      position: relative;
      z-index: 8;
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 18px;
    }

    .widget-actions.left {
      margin-left: 4px;
    }

    .widget-actions.right {
      margin-right: 4px;
    }

    .widget-action {
      appearance: none;
      border: 0;
      border-radius: 50%;
      background: var(--control-bg);
      box-shadow: none;
      color: #334155;
      cursor: pointer;
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      font: inherit;
      padding: 0;
      transition:
        background 160ms ease,
        border-color 160ms ease,
        color 160ms ease;
    }

    .widget-action:hover,
    .widget-action:focus-visible {
      border-color: rgba(31, 95, 232, 0.32);
      background: rgba(31, 95, 232, 0.1);
      color: var(--brand);
      outline: none;
    }

    .widget-action svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 1.9;
    }

    .widget-action.retract {
      color: #1f2937;
    }

    .assistant-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    .resize-handle {
      position: absolute;
      z-index: 5;
      background: transparent;
      touch-action: none;
    }

    .resize-handle[data-resize-handle="top-left"] {
      left: 0;
      top: 0;
      width: 12px;
      height: 12px;
      cursor: nwse-resize;
    }

    .resize-handle[data-resize-handle="top"] {
      left: 14px;
      right: 14px;
      top: 0;
      height: 6px;
      cursor: ns-resize;
    }

    .resize-handle[data-resize-handle="top-right"] {
      right: 0;
      top: 0;
      width: 12px;
      height: 12px;
      cursor: nesw-resize;
    }

    .resize-handle[data-resize-handle="right"] {
      right: 0;
      top: 14px;
      bottom: 14px;
      width: 8px;
      cursor: ew-resize;
    }

    .resize-handle[data-resize-handle="bottom-right"] {
      right: 0;
      bottom: 0;
      width: 12px;
      height: 12px;
      cursor: nwse-resize;
    }

    .resize-handle[data-resize-handle="bottom"] {
      left: 14px;
      right: 14px;
      bottom: 0;
      height: 8px;
      cursor: ns-resize;
    }

    .resize-handle[data-resize-handle="bottom-left"] {
      left: 0;
      bottom: 0;
      width: 12px;
      height: 12px;
      cursor: nesw-resize;
    }

    .resize-handle[data-resize-handle="left"] {
      left: 0;
      top: 14px;
      bottom: 14px;
      width: 8px;
      cursor: ew-resize;
    }

    @keyframes bubble-pop {
      0% {
        opacity: 0;
        transform: translate3d(var(--bubble-x, 0), var(--bubble-y, 0), 0) translateY(10px) scale(.76);
      }

      58% {
        opacity: 1;
        transform: translate3d(var(--bubble-x, 0), var(--bubble-y, 0), 0) translateY(-2px) scale(1.05);
      }

      100% {
        opacity: 1;
        transform: translate3d(var(--bubble-x, 0), var(--bubble-y, 0), 0) translateY(0) scale(1);
      }
    }

    @keyframes launcher-bubble-pop {
      0% {
        transform: translate3d(var(--launcher-x, 0), var(--launcher-y, 0), 0) scale(1);
      }

      42% {
        transform: translate3d(var(--launcher-x, 0), var(--launcher-y, 0), 0) scale(1.1);
      }

      100% {
        transform: translate3d(var(--launcher-x, 0), var(--launcher-y, 0), 0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .launcher,
      .widget-window,
      .launcher-bubble {
        animation: none !important;
        transition: none !important;
      }
    }

    body.is-widget-interacting .assistant-frame {
      pointer-events: none;
    }

    body.is-widget-interacting .launcher,
    body.is-widget-interacting .widget-window {
      transition: none !important;
    }

    @media (max-width: 860px) {
      body { overflow: auto; }
      .widget-window { border-radius: 20px; }
    }
  </style>
</head>
<body>
  <button id="launcher" class="launcher" type="button" aria-label="Open 中电慧语 iframe widget">
    <span class="logo-disc"><img src="/embed/cpecc-mascot.webp" alt="" draggable="false" /></span>
  </button>
  <button id="launcherBubble" class="launcher-bubble" type="button" aria-live="polite" aria-hidden="true">
    <span id="bubbleTitle" class="bubble-title"></span>
    <span id="bubbleContent" class="bubble-content"></span>
  </button>

  <section
    id="widget"
    class="widget-window"
    role="dialog"
    aria-label="中电慧语 iframe window"
    aria-hidden="true"
    inert
  >
    <header id="widgetHeader" class="widget-header">
      <div class="widget-actions left">
        <button
	          id="homeButton"
	          class="widget-action"
	          type="button"
	          title="Open 中电慧语 in browser"
	          aria-label="Open 中电慧语 in browser"
	        >
	          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
	            <circle cx="12" cy="12" r="8.5" />
	            <path d="M3.5 12h17" />
	            <path d="M12 3.5c2.2 2.35 3.4 5.08 3.4 8.5s-1.2 6.15-3.4 8.5" />
	            <path d="M12 3.5C9.8 5.85 8.6 8.58 8.6 12s1.2 6.15 3.4 8.5" />
	          </svg>
	        </button>
      </div>
      <div class="widget-actions right">
        <button id="refreshButton" class="widget-action" type="button" title="Refresh" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.35-5.65" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M20 4v5h-5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button id="retract" class="widget-action retract" type="button" title="Retract" aria-label="Retract">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m4.5 4.5 5 5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M9.5 5.5v4h-4" stroke-linecap="round" stroke-linejoin="round" />
            <path d="m19.5 19.5-5-5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M14.5 18.5v-4h4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </header>
    <iframe
      id="assistantFrame"
      class="assistant-frame"
      title="中电慧语"
      src="about:blank"
      allow="clipboard-read; clipboard-write; microphone; camera; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
    <div class="resize-handle" data-resize-handle="top-left" aria-hidden="true"></div>
    <div class="resize-handle" data-resize-handle="top" aria-hidden="true"></div>
    <div class="resize-handle" data-resize-handle="top-right" aria-hidden="true"></div>
    <div class="resize-handle" data-resize-handle="right" aria-hidden="true"></div>
    <div class="resize-handle" data-resize-handle="bottom-right" aria-hidden="true"></div>
    <div class="resize-handle" data-resize-handle="bottom" aria-hidden="true"></div>
    <div class="resize-handle" data-resize-handle="bottom-left" aria-hidden="true"></div>
    <div class="resize-handle" data-resize-handle="left" aria-hidden="true"></div>
  </section>

  <script>
    (() => {
      const launcher = document.getElementById('launcher');
      const bubble = document.getElementById('launcherBubble');
      const bubbleTitle = document.getElementById('bubbleTitle');
      const bubbleContent = document.getElementById('bubbleContent');
      const widget = document.getElementById('widget');
      const widgetHeader = document.getElementById('widgetHeader');
      const iframe = document.getElementById('assistantFrame');
      const homeButton = document.getElementById('homeButton');
      const refreshButton = document.getElementById('refreshButton');
      const retractButton = document.getElementById('retract');
      const resizeHandles = Array.from(document.querySelectorAll('.resize-handle'));
      const storageKey = 'cpecc-iframe-widget-launcher-position';
      const homeUrl = new URL('/', window.location.href).toString();
      const viewportPadding = 16;
      const desktopBreakpoint = 860;
      const minPanelWidth = 360;
      const minPanelHeight = 360;
      const fallbackLogoWidth = 256;
      const fallbackLogoHeight = 144;
      const mascotNotificationEvent = 'cpecc:mascot-notification';
      const widgetStateEvent = 'cpecc:widget-state';
      const widgetReadyEvent = 'cpecc:widget-ready';
      const bubbleDuration = 9000;
      const welcomeBubbleDelay = 900;
      const welcomeBubble = { title: '中电慧语', content: '您好，我是中电慧语' };

      let isOpen = false;
      let pendingWidgetTarget = null;
      let launcherPosition = readLauncherPosition();
      let panelPosition = { x: 0, y: 0 };
      let panelSize = getDefaultPanelSize();
      let panelGeometryInitialized = false;
      let draggingLauncher = null;
      let draggingPanel = null;
      let resizingPanel = null;
      let bubbleHideTimer = null;
      let bubblePopTimer = null;
      let currentBubbleTarget = null;

      function clamp(value, min, max) {
        if (max < min) return min;
        return Math.min(Math.max(value, min), max);
      }

      function safeJsonParse(value) {
        try { return JSON.parse(value); } catch { return null; }
      }

      function getUrlOrigin(value) {
        try {
          return new URL(value, window.location.href).origin;
        } catch {
          return null;
        }
      }

      function getNotificationOrigins() {
        return new Set(
          [window.location.origin, getUrlOrigin(homeUrl), getUrlOrigin(getIframeTarget())].filter(Boolean)
        );
      }

      function getIframeTarget() {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get('src') || '/';
        try {
          const target = new URL(raw, window.location.origin);
          if (target.origin === window.location.origin && target.pathname === window.location.pathname) {
            return new URL('/', window.location.origin).toString();
          }
          return target.toString();
        } catch {
          return new URL('/', window.location.origin).toString();
        }
      }

      function sanitizeBubbleText(value, limit) {
        const text = `${value ?? ''}`.replace(/\s+/g, ' ').trim();
        return text.length > limit ? `${text.slice(0, Math.max(0, limit - 3))}...` : text;
      }

      function toWidgetTargetUrl(value) {
        if (typeof value !== 'string' || !value.trim()) return null;

        try {
          const url = new URL(value, getIframeTarget());
          return getNotificationOrigins().has(url.origin) ? url.toString() : null;
        } catch {
          return null;
        }
      }

      function normalizeBubblePayload(payload) {
        if (typeof payload === 'string') {
          const content = sanitizeBubbleText(payload, 180);
          return content ? { title: '', content, target: null, duration: null, status: '', clear: false } : null;
        }

        if (!payload || typeof payload !== 'object') return null;

        const title = sanitizeBubbleText(payload.title, 80);
        const content = sanitizeBubbleText(payload.content ?? payload.message ?? payload.body, 180);
        const target = toWidgetTargetUrl(payload.path ?? payload.href ?? payload.url);
        const durationValue = Number(payload.duration ?? payload.bubbleDuration);
        const duration = Number.isFinite(durationValue) ? Math.max(0, durationValue) : null;
        const status = sanitizeBubbleText(payload.status ?? payload.state, 32).toLowerCase();
        const clear = payload.clear === true || payload.action === 'clear';

        if (!title && !content && !clear) return null;
        return { title, content, target, duration, status, clear };
      }

      function getIframeMessageTargetOrigin() {
        const src = iframe.getAttribute('src');
        if (!src || src === 'about:blank') return '*';

        try {
          return new URL(src, window.location.href).origin;
        } catch {
          return '*';
        }
      }

      function publishWidgetState() {
        if (!iframe.contentWindow || iframe.getAttribute('src') === 'about:blank') return;

        iframe.contentWindow.postMessage(
          {
            type: widgetStateEvent,
            payload: {
              avatarPresent: !isOpen,
              launcherVisible: !isOpen,
              widgetActive: isOpen
            }
          },
          getIframeMessageTargetOrigin()
        );
      }

      function getDefaultPanelSize() {
        const widthRatio = window.innerWidth <= desktopBreakpoint ? 0.92 : 0.4;
        const width = Math.round(window.innerWidth * widthRatio);
        const height = window.innerHeight;
        return constrainSize({ width, height });
      }

      function constrainSize(size) {
        return {
          width: clamp(size.width, Math.min(minPanelWidth, window.innerWidth), window.innerWidth),
          height: clamp(size.height, Math.min(minPanelHeight, window.innerHeight), window.innerHeight)
        };
      }

      function constrainLauncherPosition(position) {
        const launcherSize = getLauncherSize();
        return {
          x: clamp(position.x, viewportPadding, window.innerWidth - launcherSize.width - viewportPadding),
          y: clamp(position.y, viewportPadding, window.innerHeight - launcherSize.height - viewportPadding)
        };
      }

      function constrainPanelPosition(position, size = panelSize) {
        return {
          x: clamp(position.x, 0, window.innerWidth - size.width),
          y: clamp(position.y, 0, window.innerHeight - size.height)
        };
      }

      function readLauncherPosition() {
        const saved = safeJsonParse(localStorage.getItem(storageKey));
        const fallback = {
          x: window.innerWidth - getLauncherSize().width - 28,
          y: window.innerHeight - getLauncherSize().height - 28
        };
        if (!saved || typeof saved.x !== 'number' || typeof saved.y !== 'number') {
          return constrainLauncherPosition(fallback);
        }
        return constrainLauncherPosition(saved);
      }

      function saveLauncherPosition() {
        localStorage.setItem(storageKey, JSON.stringify(launcherPosition));
      }

      function applyLauncherPosition() {
        launcher.style.setProperty('--launcher-x', `${launcherPosition.x}px`);
        launcher.style.setProperty('--launcher-y', `${launcherPosition.y}px`);
        launcher.style.transform = `translate3d(${launcherPosition.x}px, ${launcherPosition.y}px, 0)`;
        applyBubblePosition();
      }

      function applyBubblePosition() {
        if (!bubble.classList.contains('is-visible')) return;

        const launcherSize = getLauncherSize();
        const bubbleWidth = bubble.offsetWidth || 260;
        const bubbleHeight = bubble.offsetHeight || 72;
        const gap = 12;
        const anchorX = launcherPosition.x + launcherSize.width - Math.min(18, launcherSize.width / 3);
        let x = anchorX - bubbleWidth + 18;
        let y = launcherPosition.y - bubbleHeight - gap;
        const isBelow = y < viewportPadding;

        if (isBelow) {
          y = launcherPosition.y + launcherSize.height + gap;
        }

        x = clamp(x, viewportPadding, window.innerWidth - bubbleWidth - viewportPadding);
        y = clamp(y, viewportPadding, window.innerHeight - bubbleHeight - viewportPadding);

        const arrowX = clamp(anchorX - x, 20, bubbleWidth - 20);
        bubble.style.setProperty('--bubble-x', `${Math.round(x)}px`);
        bubble.style.setProperty('--bubble-y', `${Math.round(y)}px`);
        bubble.style.setProperty('--bubble-arrow-x', `${Math.round(arrowX)}px`);
        bubble.classList.toggle('is-below', isBelow);
      }

      function hideBubble() {
        if (bubbleHideTimer) {
          window.clearTimeout(bubbleHideTimer);
          bubbleHideTimer = null;
        }
        bubble.classList.remove('is-visible', 'is-popping', 'is-below');
        delete bubble.dataset.status;
        bubble.setAttribute('aria-hidden', 'true');
      }

      function showBubble(payload) {
        const normalized = normalizeBubblePayload(payload);
        if (!normalized) return;
        if (normalized.clear) {
          if (!normalized.status || bubble.dataset.status === normalized.status) {
            hideBubble();
          }
          return;
        }
        if (isOpen) return;

        currentBubbleTarget = normalized.target;
        bubbleTitle.textContent = normalized.title;
        bubbleContent.textContent = normalized.content;
        if (normalized.status) {
          bubble.dataset.status = normalized.status;
        } else {
          delete bubble.dataset.status;
        }
        bubble.classList.remove('is-popping');
        bubble.classList.add('is-visible');
        bubble.setAttribute('aria-hidden', 'false');
        applyBubblePosition();

        void bubble.offsetWidth;
        bubble.classList.add('is-popping');
        launcher.classList.add('has-bubble-pop');

        if (bubblePopTimer) window.clearTimeout(bubblePopTimer);
        bubblePopTimer = window.setTimeout(() => {
          bubble.classList.remove('is-popping');
          launcher.classList.remove('has-bubble-pop');
        }, 560);

        if (bubbleHideTimer) window.clearTimeout(bubbleHideTimer);
        const hideAfter = normalized.duration ?? bubbleDuration;
        if (hideAfter > 0) {
          bubbleHideTimer = window.setTimeout(hideBubble, hideAfter);
        }
      }

      function applyPanelGeometry() {
        widget.style.left = `${panelPosition.x}px`;
        widget.style.top = `${panelPosition.y}px`;
        widget.style.width = `${panelSize.width}px`;
        widget.style.height = `${panelSize.height}px`;
      }

      function getLogoCenter() {
        const launcherSize = getLauncherSize();
        return {
          x: launcherPosition.x + launcherSize.width / 2,
          y: launcherPosition.y + launcherSize.height / 2
        };
      }

      function getLauncherSize() {
        return {
          width: launcher.offsetWidth || fallbackLogoWidth,
          height: launcher.offsetHeight || fallbackLogoHeight
        };
      }

      function getCenteredPanelPosition(size) {
        const origin = getLogoCenter();
        return constrainPanelPosition({ x: origin.x - size.width / 2, y: origin.y - size.height / 2 }, size);
      }

      function ensureIframeLoaded() {
        if (pendingWidgetTarget) {
          iframe.setAttribute('src', pendingWidgetTarget);
          pendingWidgetTarget = null;
          return;
        }

        if (iframe.getAttribute('src') === 'about:blank') {
          iframe.setAttribute('src', getIframeTarget());
        }
      }

      function animateWidget(opening, done) {
        const origin = getLogoCenter();
        const panelCenter = {
          x: panelPosition.x + panelSize.width / 2,
          y: panelPosition.y + panelSize.height / 2
        };
        const from = `translate3d(${origin.x - panelCenter.x}px, ${origin.y - panelCenter.y}px, 0) scale(0.08)`;
        const to = 'translate3d(0, 0, 0) scale(1)';
        const keyframes = opening
          ? [{ opacity: 0, transform: from }, { opacity: 1, transform: to }]
          : [{ opacity: 1, transform: to }, { opacity: 0, transform: from }];
        const animation = widget.animate(keyframes, {
          duration: opening ? 360 : 240,
          easing: opening ? 'cubic-bezier(.2,.9,.2,1)' : 'cubic-bezier(.4,0,1,1)',
          fill: 'forwards'
        });
        animation.onfinish = done;
      }

      function openWidget(options = {}) {
        if (isOpen) return;
        if (options && typeof options === 'object' && 'targetUrl' in options) {
          pendingWidgetTarget = toWidgetTargetUrl(options.targetUrl);
        }

        isOpen = true;
        hideBubble();
        ensureIframeLoaded();
        publishWidgetState();
        if (!panelGeometryInitialized) {
          panelSize = getDefaultPanelSize();
          panelPosition = getCenteredPanelPosition(panelSize);
          panelGeometryInitialized = true;
        } else {
          panelSize = constrainSize(panelSize);
          panelPosition = constrainPanelPosition(panelPosition, panelSize);
        }
        applyPanelGeometry();
        widget.classList.add('is-open');
        widget.setAttribute('aria-hidden', 'false');
        widget.inert = false;
        launcher.classList.add('is-hidden');
        launcher.setAttribute('aria-hidden', 'true');
        launcher.inert = true;
        animateWidget(true, () => {
          widget.style.opacity = '1';
          widget.style.transform = 'none';
          retractButton.focus({ preventScroll: true });
        });
      }

      function retractWidget() {
        if (!isOpen) return;
        isOpen = false;
        publishWidgetState();
        animateWidget(false, () => {
          widget.classList.remove('is-open');
          widget.setAttribute('aria-hidden', 'true');
          widget.inert = true;
          widget.style.opacity = '';
          widget.style.transform = '';
          launcher.classList.remove('is-hidden');
          launcher.removeAttribute('aria-hidden');
          launcher.inert = false;
          launcher.focus({ preventScroll: true });
        });
      }

      function resetPanelSize() {
        panelSize = getDefaultPanelSize();
        panelPosition = getCenteredPanelPosition(panelSize);
        applyPanelGeometry();
      }

      function goHome() {
        const newTab = window.open(homeUrl, '_blank');
        if (newTab) {
          newTab.opener = null;
        }
      }

      function refreshIframe() {
        try {
          iframe.contentWindow?.location.reload();
        } catch {
          const currentSrc = iframe.getAttribute('src') || getIframeTarget();
          iframe.setAttribute('src', currentSrc);
        }
      }

      function openBubbleTarget() {
        openWidget({ targetUrl: currentBubbleTarget });
      }

      function handleMascotNotificationMessage(event) {
        if (!getNotificationOrigins().has(event.origin)) return;

        const data = event.data;
        if (!data || typeof data !== 'object' || data.type !== mascotNotificationEvent) return;
        showBubble(data.payload ?? data.detail ?? data.notification);
      }

      function handleMascotNotificationEvent(event) {
        showBubble(event.detail);
      }

      function handleWidgetReadyMessage(event) {
        if (event.source !== iframe.contentWindow) return;

        const data = event.data;
        if (!data || typeof data !== 'object' || data.type !== widgetReadyEvent) return;
        publishWidgetState();
      }

      function setWidgetInteraction(active, cursor = '') {
        document.body.classList.toggle('is-widget-interacting', active);
        document.body.style.cursor = active ? cursor : '';
      }

      function stopWidgetInteractionIfIdle() {
        if (!draggingLauncher && !draggingPanel && !resizingPanel) {
          setWidgetInteraction(false);
        }
      }

      function updateLauncherDrag(event) {
        if (!draggingLauncher || draggingLauncher.pointerId !== event.pointerId) return;
        const dx = event.clientX - draggingLauncher.startX;
        const dy = event.clientY - draggingLauncher.startY;
        if (Math.abs(dx) + Math.abs(dy) > 4) draggingLauncher.moved = true;
        launcherPosition = constrainLauncherPosition({
          x: draggingLauncher.originX + dx,
          y: draggingLauncher.originY + dy
        });
        applyLauncherPosition();
      }

      function finishLauncherDrag(event) {
        if (!draggingLauncher || draggingLauncher.pointerId !== event.pointerId) return;
        try {
          launcher.releasePointerCapture(event.pointerId);
        } catch {}
        const shouldOpen = !draggingLauncher.moved;
        draggingLauncher = null;
        saveLauncherPosition();
        stopWidgetInteractionIfIdle();
        if (shouldOpen) openWidget();
      }

      function updatePanelDrag(event) {
        if (!draggingPanel || draggingPanel.pointerId !== event.pointerId) return;
        panelPosition = constrainPanelPosition({
          x: draggingPanel.originX + event.clientX - draggingPanel.startX,
          y: draggingPanel.originY + event.clientY - draggingPanel.startY
        });
        applyPanelGeometry();
      }

      function finishPanelDrag(event) {
        if (!draggingPanel || draggingPanel.pointerId !== event.pointerId) return;
        try {
          widgetHeader.releasePointerCapture(event.pointerId);
        } catch {}
        draggingPanel = null;
        stopWidgetInteractionIfIdle();
      }

      function updatePanelResize(event) {
        if (!resizingPanel || resizingPanel.pointerId !== event.pointerId) return;
        const dx = event.clientX - resizingPanel.startX;
        const dy = event.clientY - resizingPanel.startY;
        const handle = resizingPanel.handle || '';
        const fromLeft = handle.includes('left');
        const fromRight = handle.includes('right');
        const fromTop = handle.includes('top');
        const fromBottom = handle.includes('bottom');
        const rightEdge = resizingPanel.startPanelX + resizingPanel.startWidth;
        const bottomEdge = resizingPanel.startPanelY + resizingPanel.startHeight;
        let nextX = fromLeft ? resizingPanel.startPanelX + dx : resizingPanel.startPanelX;
        let nextY = fromTop ? resizingPanel.startPanelY + dy : resizingPanel.startPanelY;
        let nextWidth = resizingPanel.startWidth;
        let nextHeight = resizingPanel.startHeight;

        if (fromLeft) {
          nextWidth = rightEdge - nextX;
        } else if (fromRight) {
          nextWidth = resizingPanel.startWidth + dx;
        }

        if (fromTop) {
          nextHeight = bottomEdge - nextY;
        } else if (fromBottom) {
          nextHeight = resizingPanel.startHeight + dy;
        }

        nextWidth = clamp(nextWidth, Math.min(minPanelWidth, window.innerWidth), window.innerWidth);
        nextHeight = clamp(nextHeight, Math.min(minPanelHeight, window.innerHeight), window.innerHeight);

        if (fromLeft) nextX = rightEdge - nextWidth;
        if (fromTop) nextY = bottomEdge - nextHeight;

        panelSize = { width: nextWidth, height: nextHeight };
        panelPosition = constrainPanelPosition({ x: nextX, y: nextY }, panelSize);
        applyPanelGeometry();
      }

      function finishPanelResize(event) {
        if (!resizingPanel || resizingPanel.pointerId !== event.pointerId) return;
        const activeHandle = resizeHandles.find(
          (resizeHandle) => resizeHandle.dataset.resizeHandle === resizingPanel.handle
        );
        try {
          activeHandle?.releasePointerCapture(event.pointerId);
        } catch {}
        resizingPanel = null;
        stopWidgetInteractionIfIdle();
      }

      function handleGlobalPointerMove(event) {
        updateLauncherDrag(event);
        updatePanelDrag(event);
        updatePanelResize(event);
      }

      function handleGlobalPointerEnd(event) {
        finishLauncherDrag(event);
        finishPanelDrag(event);
        finishPanelResize(event);
        stopWidgetInteractionIfIdle();
      }

      launcher.addEventListener('pointerdown', (event) => {
        if (isOpen || event.button !== 0) return;
        event.preventDefault();
        launcher.setPointerCapture(event.pointerId);
        setWidgetInteraction(true, 'grabbing');
        draggingLauncher = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          originX: launcherPosition.x,
          originY: launcherPosition.y,
          moved: false
        };
      });

      launcher.addEventListener('pointerup', (event) => {
        finishLauncherDrag(event);
      });

      launcher.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openWidget();
        }
      });

      launcher.addEventListener('dragstart', (event) => {
        event.preventDefault();
      });

      widgetHeader.addEventListener('pointerdown', (event) => {
        if (
          event.button !== 0 ||
          (event.target instanceof Element && event.target.closest('button'))
        ) {
          return;
        }
        widgetHeader.setPointerCapture(event.pointerId);
        setWidgetInteraction(true, 'grabbing');
        draggingPanel = {
          pointerId: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          originX: panelPosition.x,
          originY: panelPosition.y
        };
      });

      widgetHeader.addEventListener('pointerup', (event) => {
        finishPanelDrag(event);
      });

      resizeHandles.forEach((resizeHandle) => {
        resizeHandle.addEventListener('pointerdown', (event) => {
          if (event.button !== 0) return;
          event.preventDefault();
          resizeHandle.setPointerCapture(event.pointerId);
          setWidgetInteraction(true, getComputedStyle(resizeHandle).cursor || 'default');
          resizingPanel = {
            pointerId: event.pointerId,
            handle: resizeHandle.dataset.resizeHandle,
            startX: event.clientX,
            startY: event.clientY,
            startPanelX: panelPosition.x,
            startPanelY: panelPosition.y,
            startWidth: panelSize.width,
            startHeight: panelSize.height
          };
        });

        resizeHandle.addEventListener('pointerup', (event) => {
          finishPanelResize(event);
        });
      });

      homeButton.addEventListener('click', goHome);
      refreshButton.addEventListener('click', refreshIframe);
      retractButton.addEventListener('click', retractWidget);
      bubble.addEventListener('click', openBubbleTarget);

      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && isOpen) retractWidget();
      });

      window.addEventListener('message', handleMascotNotificationMessage);
      window.addEventListener('message', handleWidgetReadyMessage);
      window.addEventListener(mascotNotificationEvent, handleMascotNotificationEvent);
      window.addEventListener('pointermove', handleGlobalPointerMove);
      window.addEventListener('pointerup', handleGlobalPointerEnd);
      window.addEventListener('pointercancel', handleGlobalPointerEnd);

      window.addEventListener('resize', () => {
        launcherPosition = constrainLauncherPosition(launcherPosition);
        applyLauncherPosition();
        if (isOpen) {
          panelSize = constrainSize(panelSize);
          panelPosition = constrainPanelPosition(panelPosition, panelSize);
          applyPanelGeometry();
        }
      });

      iframe.addEventListener('load', publishWidgetState);

      applyLauncherPosition();
      window.setTimeout(() => {
        if (!bubble.classList.contains('is-visible')) {
          showBubble(welcomeBubble);
        }
      }, welcomeBubbleDelay);
    })();
  </script>
</body>
</html>
